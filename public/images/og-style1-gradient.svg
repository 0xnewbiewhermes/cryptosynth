<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#059669;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#047857;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="60" y="60" width="1080" height="510" rx="20" fill="white" fill-opacity="0.15"/>
  
  <!-- Category Badge -->
  <rect x="80" y="100" width="120" height="36" rx="18" fill="white" fill-opacity="0.9"/>
  <text x="140" y="124" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#059669" text-anchor="middle">BERITA</text>
  
  <!-- Title -->
  <text x="80" y="200" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="800" fill="white">
    <tspan x="80" dy="0">Bitcoin Tembus $82.000</tspan>
    <tspan x="80" dy="55">Apa yang Perlu Kamu Tahu</tspan>
  </text>
  
  <!-- Description -->
  <text x="80" y="350" font-family="Inter, Arial, sans-serif" font-size="20" fill="white" fill-opacity="0.8">
    <tspan x="80" dy="0">Bitcoin mencatat rekor baru didorong</tspan>
    <tspan x="80" dy="30">akumulasi institusional dan regulasi.</tspan>
  </text>
  
  <!-- Branding -->
  <text x="80" y="520" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="white" fill-opacity="0.6">CryptoSynth.id</text>
  <text x="1120" y="520" font-family="Inter, Arial, sans-serif" font-size="14" fill="white" fill-opacity="0.5" text-anchor="end">12 Mei 2026</text>
  
  <!-- Decorative circles -->
  <circle cx="1050" cy="150" r="80" fill="white" fill-opacity="0.08"/>
  <circle cx="1100" cy="250" r="50" fill="white" fill-opacity="0.05"/>
</svg>