<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 140" width="500" height="140">
  <defs>
    <linearGradient id="sapphireGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="sapphireLight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <linearGradient id="darkShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1E40AF" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background subtle dot pattern - optional, uncomment if wanted -->
  <!--
  <pattern id="dots" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="0.5" fill="#1E40AF" opacity="0.04"/>
  </pattern>
  <rect width="500" height="140" fill="url(#dots)" rx="12"/>
  -->

  <!-- ===== ICON MARK: Interlocking C+S ===== -->
  <g transform="translate(20, 20)" filter="url(#shadow)">

    <!-- Outter ring - subtle orbit -->
    <circle cx="50" cy="50" r="44" fill="none" stroke="url(#sapphireGrad)" stroke-width="1.5" opacity="0.2"/>

    <!-- Hexagon base (blockchain) -->
    <polygon points="50,8 78,22 78,50 50,64 22,50 22,22"
             fill="none" stroke="url(#sapphireGrad)" stroke-width="2.5"/>

    <!-- C letter (Crypto) - left curve inside hexagon -->
    <path d="M 30 30 Q 30 25 38 25 L 42 25"
          fill="none" stroke="url(#sapphireLight)" stroke-width="3" stroke-linecap="round"/>
    <path d="M 30 30 Q 26 38 30 46"
          fill="none" stroke="url(#sapphireLight)" stroke-width="3" stroke-linecap="round"/>
    <path d="M 42 56 L 38 56 Q 30 56 30 50"
          fill="none" stroke="url(#sapphireLight)" stroke-width="3" stroke-linecap="round"/>

    <!-- S letter (Synth) - right diagonal inside hexagon -->
    <path d="M 62 28 Q 72 28 70 36 Q 68 44 58 44 Q 50 44 50 50 Q 50 56 58 56 L 70 56"
          fill="none" stroke="url(#sapphireGrad)" stroke-width="3" stroke-linecap="round"/>

    <!-- Accent dot - top right -->
    <circle cx="72" cy="18" r="2.5" fill="url(#sapphireLight)" opacity="0.7"/>
  </g>

  <!-- ===== WORDMARK ===== -->
  <g transform="translate(105, 30)">
    <!-- Crypto -->
    <text x="0" y="40" font-family="'Playfair Display', 'Georgia', serif" font-size="40" font-weight="800" fill="#1C1812" letter-spacing="-0.04">
      Crypto
    </text>

    <!-- Synth (highlighted) -->
    <text x="0" y="40" font-family="'Playfair Display', 'Georgia', serif" font-size="40" font-weight="800" letter-spacing="-0.02">
      <tspan fill="url(#sapphireGrad)">Synth</tspan>
    </text>

    <!-- Separator line -->
    <line x1="0" y1="52" x2="72" y2="52" stroke="url(#sapphireGrad)" stroke-width="1.5" opacity="0.3"/>

    <!-- Domain -->
    <text x="0" y="70" font-family="'Outfit', 'Inter', system-ui, sans-serif" font-size="12" fill="#1C1812" opacity="0.35" letter-spacing="0.06" font-weight="400">
      .id
    </text>
  </g>

  <!-- ===== TAGLINE ===== -->
  <g transform="translate(105, 108)">
    <text x="0" y="14" font-family="'Outfit', 'Inter', system-ui, sans-serif" font-size="11" fill="#1E40AF" opacity="0.6" letter-spacing="0.32" font-weight="500">
      RINGKASAN BERITA WEB3 INDONESIA
    </text>
  </g>
</svg>
