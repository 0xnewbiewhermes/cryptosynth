<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#0F172A"/>
  
  <!-- Accent line -->
  <rect x="0" y="0" width="1200" height="4" fill="#059669"/>
  
  <!-- Grid pattern -->
  <line x1="200" y1="0" x2="200" y2="630" stroke="white" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="400" y1="0" x2="400" y2="630" stroke="white" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="600" y1="0" x2="600" y2="630" stroke="white" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="800" y1="0" x2="800" y2="630" stroke="white" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="1000" y1="0" x2="1000" y2="630" stroke="white" stroke-opacity="0.03" stroke-width="1"/>
  
  <!-- Category Badge -->
  <rect x="80" y="120" width="120" height="36" rx="4" fill="#059669"/>
  <text x="140" y="144" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="white" text-anchor="middle" letter-spacing="1">BERITA</text>
  
  <!-- Title -->
  <text x="80" y="220" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="800" fill="white">
    <tspan x="80" dy="0">Bitcoin Tembus $82.000</tspan>
    <tspan x="80" dy="58">Apa yang Perlu Kamu Tahu</tspan>
  </text>
  
  <!-- Divider -->
  <rect x="80" y="370" width="60" height="3" fill="#059669"/>
  
  <!-- Description -->
  <text x="80" y="410" font-family="Inter, Arial, sans-serif" font-size="18" fill="#94A3B8">
    <tspan x="80" dy="0">Bitcoin mencatat rekor baru didorong</tspan>
    <tspan x="80" dy="28">akumulasi institusional dan regulasi.</tspan>
  </text>
  
  <!-- Branding -->
  <text x="80" y="560" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#059669">CryptoSynth.id</text>
  <text x="1120" y="560" font-family="Inter, Arial, sans-serif" font-size="14" fill="#64748B" text-anchor="end">12 Mei 2026</text>
  
  <!-- Accent shape -->
  <rect x="1050" y="400" width="120" height="120" rx="8" fill="#059669" fill-opacity="0.1" transform="rotate(15 1110 460)"/>
</svg>