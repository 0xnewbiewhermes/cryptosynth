<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#FAFAFA"/>
  
  <!-- Left accent -->
  <rect x="0" y="0" width="8" height="630" fill="#059669"/>
  
  <!-- Right decorative block -->
  <rect x="800" y="0" width="400" height="630" fill="#F4F4F5"/>
  <text x="1000" y="340" font-family="Inter, Arial, sans-serif" font-size="180" font-weight="900" fill="#059669" fill-opacity="0.08" text-anchor="middle">BTC</text>
  
  <!-- Category Badge -->
  <rect x="60" y="120" width="120" height="36" rx="18" fill="#059669" fill-opacity="0.1"/>
  <text x="120" y="144" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#059669" text-anchor="middle">BERITA</text>
  
  <!-- Title -->
  <text x="60" y="220" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="800" fill="#18181B">
    <tspan x="60" dy="0">Bitcoin Tembus</tspan>
    <tspan x="60" dy="52">$82.000 — Apa</tspan>
    <tspan x="60" dy="52">yang Perlu Kamu Tahu</tspan>
  </text>
  
  <!-- Description -->
  <text x="60" y="420" font-family="Inter, Arial, sans-serif" font-size="16" fill="#71717A">
    <tspan x="60" dy="0">Bitcoin mencatat rekor baru didorong</tspan>
    <tspan x="60" dy="24">akumulasi institusional dan regulasi.</tspan>
  </text>
  
  <!-- Branding -->
  <text x="60" y="560" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#18181B">CryptoSynth<span fill="#059669">.id</span></text>
  <text x="720" y="560" font-family="Inter, Arial, sans-serif" font-size="14" fill="#A1A1AA" text-anchor="end">12 Mei 2026</text>
</svg>