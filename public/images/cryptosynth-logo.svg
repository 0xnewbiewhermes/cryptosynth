<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60">
  <defs>
    <linearGradient id="lg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="lg2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3730A3" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <!-- === ICON === -->
  <g transform="translate(2, 2)">
    <!-- Hexagon shadow -->
    <polygon points="28 2, 50 13, 50 35, 28 46, 6 35, 6 13" fill="rgba(55,48,163,0.15)"/>
    <!-- Hexagon base -->
    <polygon points="28 1, 51 12.5, 51 36.5, 28 48, 5 36.5, 5 12.5" fill="url(#lg2)" stroke="url(#lg1)" stroke-width="2.2"/>
    <!-- Sine wave top — rising frequency -->
    <path d="M10 20 Q15 12 20 20 Q25 28 30 20 Q35 12 40 20 Q44 24.5 46 22" fill="none" stroke="#818CF8" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Sine wave bottom — flipped, denser frequency -->
    <path d="M10 32 Q15 40 20 32 Q25 24 30 32 Q35 40 40 32 Q44 27.5 46 30" fill="none" stroke="#4F46E5" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Center glow dot -->
    <circle cx="28" cy="28" r="3" fill="#4F46E5" opacity="0.5"/>
  </g>

  <!-- === TYPOGRAPHY === -->
  <text x="64" y="38" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-size="28" font-weight="700" fill="#1A1A2E" letter-spacing="-0.04em">Crypt<span fill="#4F46E5">Synth</span></text>
  <text x="64" y="53" font-family="'Inter', system-ui, sans-serif" font-size="9.5" font-weight="500" fill="#6B7280" letter-spacing="0.15em" text-transform="uppercase">WEB3 INSIGHTS DAILY</text>
</svg>
