<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CryptoSynth — Terminal Mobile</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Fraunces:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{font-family:'JetBrains Mono',monospace;background:#0c0c0c;color:#a0a0a0;display:flex;flex-direction:column;height:100vh;height:100dvh;-webkit-font-smoothing:antialiased}
::selection{background:rgba(16,185,129,0.3)}

/* Top bar (mobile) */
.topbar{height:40px;background:#161616;border-bottom:1px solid #2a2a2a;display:flex;align-items:center;padding:0 0.75rem;flex-shrink:0;gap:0.5rem}
.topbar-left{display:flex;gap:0.5rem;align-items:center}
.dot{width:8px;height:8px;border-radius:50%}.dot-r{background:#ff5f56}.dot-y{background:#ffbd2e}.dot-g{background:#27c93f}
.topbar-title{font-size:0.6rem;color:#555;margin-left:0.25rem;flex:1;text-align:center}
.topbar-right{font-size:0.55rem;color:#444;font-family:'JetBrains Mono',monospace}

/* Terminal area */
.terminal{flex:1;overflow-y:auto;padding:1rem 0.75rem;font-size:0.7rem;line-height:1.65;scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
.terminal::-webkit-scrollbar{width:4px}.terminal::-webkit-scrollbar-track{background:transparent}.terminal::-webkit-scrollbar-thumb{background:#2a2a2a;border-radius:2px}

.output-line{margin-bottom:0.1rem;word-break:break-word}
.output-line.cmd{color:#10b981}
.output-line.info{color:#a0a0a0}
.output-line.highlight{color:#f0f0f0}
.output-line.accent{color:#3b82f6}
.output-line.muted{color:#555}
.output-line.success{color:#10b981}
.output-line.warn{color:#f59e0b}
.output-line.error{color:#ef4444}

.ascii-art{color:#3b82f6;font-size:0.32rem;line-height:1.2;margin-bottom:0.75rem;white-space:pre;overflow-x:auto}

.article-entry{padding:0.35rem 0.5rem;cursor:pointer;transition:all 0.15s;border-left:2px solid transparent;margin:0.15rem 0}
.article-entry:active{border-left-color:#3b82f6;background:rgba(59,130,246,0.05)}
.art-num{color:#444;margin-right:0.4rem;font-size:0.65rem}
.art-tag{color:#f59e0b;font-size:0.6rem}
.art-title{color:#e0e0e0;font-size:0.7rem}
.art-date{color:#444;font-size:0.6rem;display:block;margin-top:0.15rem}

.input-area{flex-shrink:0;background:#111;border-top:1px solid #2a2a2a;padding:0.5rem 0.75rem;display:flex;align-items:center;gap:0.4rem}
.prompt-mobile{color:#6366f1;font-size:0.65rem;font-weight:600;white-space:nowrap}
.input-area input{flex:1;background:transparent;border:none;color:#e0e0e0;font-family:'JetBrains Mono',monospace;font-size:0.72rem;outline:none;caret-color:#10b981;min-width:0}

/* Quick action buttons (mobile-only) */
.quick-actions{flex-shrink:0;display:flex;gap:0;padding:0;background:#161616;border-top:1px solid #2a2a2a;overflow-x:auto;-webkit-overflow-scrolling:touch}
.quick-actions::-webkit-scrollbar{display:none}
.qa-btn{flex-shrink:0;padding:0.5rem 0.75rem;font-size:0.6rem;font-family:'JetBrains Mono',monospace;color:#555;background:transparent;border:none;border-right:1px solid #222;cursor:pointer;transition:all 0.15s;white-space:nowrap}
.qa-btn:active{background:#2a2a2a;color:#10b981}
.qa-btn .icon{margin-right:0.3rem}

/* Status bar */
.status-bar{height:20px;background:#161616;border-top:1px solid #2a2a2a;display:flex;align-items:center;padding:0 0.75rem;font-size:0.5rem;color:#444;flex-shrink:0;justify-content:space-between}

/* Swipe hint */
.swipe-hint{position:fixed;bottom:60px;left:50%;transform:translateX(-50%);background:rgba(30,30,30,0.9);backdrop-filter:blur(8px);padding:0.4rem 1rem;font-size:0.6rem;color:#555;border-radius:999px;border:1px solid #2a2a2a;pointer-events:none;opacity:1;transition:opacity 0.5s;z-index:100}
.swipe-hint.hidden{opacity:0}

/* Article detail view */
.article-view{display:none;padding:0.75rem}
.article-view.active{display:block}
.back-btn{color:#6366f1;font-size:0.65rem;cursor:pointer;margin-bottom:0.75rem;display:inline-block;padding:0.3rem 0.6rem;background:rgba(99,102,241,0.08);border:1px solid rgba(99,102,241,0.15)}
.back-btn:active{background:rgba(99,102,241,0.15)}
.article-view .art-tag-big{font-size:0.6rem;color:#f59e0b;text-transform:uppercase;letter-spacing:0.12em;margin-bottom:0.5rem;font-weight:600}
.article-view h2{font-family:'Fraunces',serif;font-size:1.1rem;font-weight:700;color:#f0f0f0;line-height:1.3;margin-bottom:0.5rem}
.article-view .meta{font-size:0.6rem;color:#555;margin-bottom:0.75rem}
.article-view .body{color:#b0b0b0;line-height:1.75;font-size:0.72rem}
.article-view .body p{margin-bottom:0.75rem}

@media(min-width:768px){
  .quick-actions{display:none}
  .swipe-hint{display:none}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <div class="dot dot-r"></div><div class="dot dot-y"></div><div class="dot dot-g"></div>
  </div>
  <span class="topbar-title">cryptosynth — zsh</span>
  <span class="topbar-right" id="clock"></span>
</div>

<div class="terminal" id="terminal">
  <div id="output"></div>
  <div id="articleView" class="article-view"></div>
  <div class="input-area" id="inputArea">
    <span class="prompt-mobile">$</span>
    <input type="text" id="cmdInput" placeholder="ketik help..." spellcheck="false" autocomplete="off" autocapitalize="off">
  </div>
</div>

<div class="quick-actions">
  <button class="qa-btn" onclick="execCmd('ls')"><span class="icon">📂</span>ls</button>
  <button class="qa-btn" onclick="execCmd('grep airdrop')"><span class="icon">🔍</span>airdrop</button>
  <button class="qa-btn" onclick="execCmd('grep tutorial')"><span class="icon">📖</span>tutorial</button>
  <button class="qa-btn" onclick="execCmd('whoami')"><span class="icon">👤</span>whoami</button>
  <button class="qa-btn" onclick="execCmd('help')"><span class="icon">❓</span>help</button>
  <button class="qa-btn" onclick="execCmd('clear')"><span class="icon">🧹</span>clear</button>
</div>

<div class="status-bar">
  <span>7 catatan</span>
  <span>CryptoSynth.id v1.0</span>
</div>

<div class="swipe-hint" id="swipeHint">↑ Swipe up to scroll · Tap buttons below for quick commands</div>

<script>
const output = document.getElementById('output');
const input = document.getElementById('cmdInput');
const terminal = document.getElementById('terminal');
const articleView = document.getElementById('articleView');

const articles = [
  {num:'01',tag:'AIRDROP',cat:'Q2-2026',title:'7 Airdrop yang Layak Difarming Q2 2026',slug:'airdrop-q2-2026',exc:'Polymarket, Beacon, SosoValue, dan lainnya.',date:'29 Mei 2026',ago:'6 jam lalu'},
  {num:'02',tag:'SOFI',cat:'STABLECOIN',title:'SoFi Luncurkan Stablecoin (SoFiUSD)',slug:'sofi-usd',exc:'Bank Pertama di AS Masuk On-Chain.',date:'29 Mei 2026',ago:'8 jam lalu'},
  {num:'03',tag:'VARIATIONAL',cat:'AIRDROP',title:'Variational Deep-Dive: Tim Ex-Jane Street',slug:'variational',exc:'Tim, model bisnis, strategi farming.',date:'28 Mei 2026',ago:'1 hari lalu'},
  {num:'04',tag:'OPTIMAI',cat:'TUTORIAL',title:'Install OptimAI Core Node di VPS',slug:'optimai-vps',exc:'CLI Setup + Systemd Service.',date:'27 Mei 2026',ago:'1 hari lalu'},
  {num:'05',tag:'SYMB',cat:'PROPRXYZ',title:'SYMB TGE Juni, ProprXYZ di Hyperliquid',slug:'symb-proprxyz',exc:'3 Airdrop yang Wajib Dicek.',date:'27 Mei 2026',ago:'2 hari lalu'},
  {num:'06',tag:'OPTIMAI',cat:'AIRDROP',title:'OptimAI: Farming DePIN + AI',slug:'optimai-airdrop',exc:'2 Juta Node Aktif.',date:'26 Mei 2026',ago:'3 hari lalu'},
  {num:'07',tag:'CATENA',cat:'AIRDROP',title:'Catena Labs: $48M dari a16z',slug:'catena-labs',exc:'Spekulatif atau Peluang Nyata?',date:'26 Mei 2026',ago:'3 hari lalu'},
];

let history = [], historyIdx = -1;

function print(html, cls='info') {
  const div = document.createElement('div');
  div.className = 'output-line ' + cls;
  div.innerHTML = html;
  output.appendChild(div);
  terminal.scrollTop = terminal.scrollHeight;
}

function showWelcome() {
  print('<pre class="ascii-art"> ██████╗██████╗██╗   ██╗██████╗████████╗ ██████╗\n██╔════╝██╔══██╗╚██╗ ██╔╝██╔══██╗╚══██╔══╝██╔═══██╗\n██║     ██████╔╝ ╚████╔╝ ██████╔╝  ██║   ██║   ██║\n██║     ██╔══██╗  ╚██╔╝  ██╔═══╝   ██║   ██║   ██║\n╚██████╗██║  ██║   ██║   ██║       ██║   ╚██████╔╝\n ╚═════╝╚═╝  ╚═╝   ╚═╝   ╚═╝       ╚═╝    ╚═════╝</pre>', 'accent');
  print('Catatan Crypto Personal', 'highlight');
  print('Node logs, airdrop farming, trading, opini.', 'muted');
  print('', 'info');
  print('Ketik <span style="color:#f59e0b">help</span> atau tap tombol di bawah.', 'info');
  print('', 'info');
}

function showHelp() {
  print('┌─────────────────────────────────┐', 'muted');
  print('│  <span style="color:#f0f0f0;font-weight:600">COMMAND</span>     <span style="color:#f0f0f0;font-weight:600">FUNGSI</span>         │', 'muted');
  print('├─────────────────────────────────┤', 'muted');
  print('│  <span style="color:#f59e0b">ls</span>          Daftar catatan   │', 'muted');
  print('│  <span style="color:#f59e0b">cat &lt;slug&gt;</span>  Baca catatan     │', 'muted');
  print('│  <span style="color:#f59e0b">grep &lt;kata&gt;</span> Cari catatan     │', 'muted');
  print('│  <span style="color:#f59e0b">whoami</span>      Tentang penulis  │', 'muted');
  print('│  <span style="color:#f59e0b">clear</span>       Bersihkan layar  │', 'muted');
  print('└─────────────────────────────────┘', 'muted');
  print('', 'info');
  print('Tips: Tap tombol di bawah untuk akses cepat.', 'muted');
  print('', 'info');
}

function showList() {
  print('', 'info');
  print('  <span style="color:#555">NO  TAG            CATATAN</span>', 'info');
  print('  <span style="color:#333">──  ───            ───────</span>', 'info');
  articles.forEach(a => {
    const tag = (a.tag).padEnd(12);
    const div = document.createElement('div');
    div.className = 'output-line info article-entry';
    div.innerHTML = `<span class="art-num">${a.num}</span><span class="art-tag">${tag}</span> <span class="art-title">${a.title}</span><span class="art-date">${a.date} · ${a.ago}</span>`;
    div.onclick = () => showArticle(a.slug);
    output.appendChild(div);
  });
  print('', 'info');
  print(`  <span style="color:#555">Tap judul untuk baca. Total: ${articles.length}</span>`, 'info');
  print('', 'info');
  terminal.scrollTop = terminal.scrollHeight;
}

function showArticle(slug) {
  const a = articles.find(x => x.slug === slug);
  if (!a) { print(`cat: ${slug}: not found`, 'error'); return; }
  output.style.display = 'none';
  document.getElementById('inputArea').style.display = 'none';
  articleView.classList.add('active');
  articleView.innerHTML = `
    <div class="back-btn" onclick="backToList()">← kembali</div>
    <div class="art-tag-big">#${a.tag} · #${a.cat}</div>
    <h2>${a.title}</h2>
    <div class="meta">${a.date} · ${a.ago} · Gideon</div>
    <div class="body">
      <p>${a.exc}</p>
      <p style="color:#555;font-style:italic">[Konten lengkap akan dimuat di sini...]</p>
      <p style="color:#555;font-size:0.65rem">Ketik <span style="color:#f59e0b">ls</span> untuk kembali ke daftar.</p>
    </div>
  `;
  terminal.scrollTop = 0;
}

function backToList() {
  articleView.classList.remove('active');
  articleView.innerHTML = '';
  output.style.display = 'block';
  document.getElementById('inputArea').style.display = 'flex';
}

function showWhoami() {
  print('', 'info');
  print('  <span style="color:#f0f0f0;font-weight:600">Gideon</span>', 'info');
  print('  Crypto practitioner.', 'muted');
  print('  Node operator. Airdrop farmer.', 'muted');
  print('', 'info');
  print('  Bukan financial advisor.', 'muted');
  print('  Bukan portal berita.', 'muted');
  print('  Cuma seseorang yang setiap hari', 'muted');
  print('  ngurusin node, farming airdrop,', 'muted');
  print('  trading, dan opini soal crypto.', 'muted');
  print('', 'info');
  print('  <span style="color:#6366f1">cryptosynth.id</span>', 'info');
  print('', 'info');
}

function execCmd(cmd) {
  backToList();
  const parts = cmd.trim().split(/\s+/);
  const command = parts[0]?.toLowerCase();
  const arg = parts.slice(1).join(' ');
  print(`<span style="color:#6366f1">$</span> <span style="color:#10b981">${cmd}</span>`, 'cmd');
  switch(command) {
    case '': break;
    case 'help': showHelp(); break;
    case 'ls': case 'list': showList(); break;
    case 'cat': case 'read':
      if(arg){const slug = articles.find(a=>a.slug.includes(arg)||a.title.toLowerCase().includes(arg.toLowerCase()))?.slug;if(slug)showArticle(slug);else print(`"${arg}" tidak ditemukan`, 'warn');}
      else print('Usage: cat &lt;slug&gt;', 'warn');
      break;
    case 'grep': case 'search':
      if(!arg){print('Usage: grep &lt;keyword&gt;', 'warn');break;}
      const found = articles.filter(a => a.title.toLowerCase().includes(arg.toLowerCase()) || a.tag.toLowerCase().includes(arg.toLowerCase()) || a.exc.toLowerCase().includes(arg.toLowerCase()));
      if(!found.length) print(`Tidak ditemukan: "${arg}"`, 'warn');
      else { print(`Ditemukan ${found.length}:`, 'success'); found.forEach(a => { const d = document.createElement('div'); d.className='output-line info article-entry'; d.innerHTML=`<span class="art-num">${a.num}</span> <span class="art-title">${a.title}</span>`; d.onclick=()=>showArticle(a.slug); output.appendChild(d); }); }
      break;
    case 'whoami': case 'about': showWhoami(); break;
    case 'clear': case 'cls': output.innerHTML=''; break;
    case 'exit': case 'quit': print('Tidak bisa keluar. Lo sudah di dalam.', 'warn'); break;
    case 'sudo': print('Nice try. Ini blog, bukan server.', 'warn'); break;
    default: print(`"${command}" not found. Ketik <span style="color:#f59e0b">help</span>`, 'error');
  }
  terminal.scrollTop = terminal.scrollHeight;
}

input.addEventListener('keydown', e => {
  if(e.key==='Enter'){const cmd=input.value;if(cmd){history.push(cmd);historyIdx=history.length;}execCmd(cmd);input.value='';}
  if(e.key==='ArrowUp'){e.preventDefault();if(historyIdx>0){historyIdx--;input.value=history[historyIdx];}}
  if(e.key==='ArrowDown'){e.preventDefault();if(historyIdx<history.length-1){historyIdx++;input.value=history[historyIdx];}else{historyIdx=history.length;input.value='';}}
});

// Clock
function updateClock(){document.getElementById('clock').textContent=new Date().toLocaleTimeString('en-US',{hour12:false,hour:'2-digit',minute:'2-digit'});}
updateClock();setInterval(updateClock,1000);

// Hide swipe hint after first interaction
input.addEventListener('focus',()=>{document.getElementById('swipeHint').classList.add('hidden');},{once:true});
document.querySelectorAll('.qa-btn').forEach(b=>b.addEventListener('click',()=>{document.getElementById('swipeHint').classList.add('hidden');},{once:true}));

showWelcome();
</script>
</body>
</html>
