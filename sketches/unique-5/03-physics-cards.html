<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CryptoSynth — Physics Cards</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;700;900&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',sans-serif;background:#F7F5F0;color:#1C1812;overflow:hidden;height:100vh;-webkit-font-smoothing:antialiased}
::selection{background:rgba(30,64,175,0.2)}

canvas{position:fixed;inset:0;z-index:0}

.nav{position:fixed;top:0;left:0;right:0;height:52px;padding:0 2.5rem;display:flex;justify-content:space-between;align-items:center;z-index:100;background:rgba(247,245,240,0.85);backdrop-filter:blur(16px);border-bottom:1px solid rgba(28,24,18,0.06)}
.logo{font-family:'Fraunces',serif;font-size:1rem;font-weight:800;color:#1C1812;text-decoration:none}
.nav-links{display:flex;gap:0.25rem}
.nav-links a{color:rgba(28,24,18,0.4);text-decoration:none;font-size:0.78rem;font-weight:500;padding:0.4rem 0.75rem;border-radius:6px;transition:all 0.2s}
.nav-links a:hover{color:#1C1812;background:rgba(28,24,18,0.04)}
.nav-links a.active{color:#1E40AF}

/* Floating cards on canvas */
.card{position:absolute;background:#fff;border:1px solid rgba(28,24,18,0.06);padding:1.25rem 1.5rem;cursor:grab;user-select:none;z-index:10;transition:box-shadow 0.2s,transform 0.1s;width:280px}
.card:hover{box-shadow:0 8px 30px rgba(30,64,175,0.08)}
.card.dragging{cursor:grabbing;z-index:100;box-shadow:0 12px 40px rgba(30,64,175,0.12);transform:scale(1.02)}
.card-tag{font-size:0.52rem;text-transform:uppercase;letter-spacing:0.12em;color:#1E40AF;margin-bottom:0.4rem;font-weight:600}
.card-title{font-family:'Fraunces',serif;font-size:1rem;font-weight:700;line-height:1.3;margin-bottom:0.35rem}
.card-exc{font-size:0.75rem;color:rgba(28,24,18,0.5);line-height:1.5;margin-bottom:0.6rem}
.card-footer{display:flex;justify-content:space-between;align-items:center}
.card-date{font-size:0.62rem;color:rgba(28,24,18,0.2)}
.card-arrow{font-size:0.75rem;color:rgba(28,24,18,0.15);transition:all 0.2s}
.card:hover .card-arrow{color:#1E40AF;transform:translateX(3px)}

/* Hero overlay */
.hero-overlay{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;justify-content:center;align-items:center;pointer-events:none;transition:opacity 0.5s}
.hero-overlay.hidden{opacity:0}
.hero-overlay h1{font-family:'Fraunces',serif;font-size:clamp(2.5rem,5vw,4rem);font-weight:900;letter-spacing:-0.04em;text-align:center;color:#1C1812;margin-bottom:0.75rem}
.hero-overlay p{font-size:0.95rem;color:rgba(28,24,18,0.4);text-align:center;max-width:400px;line-height:1.6}
.hero-overlay .hint{margin-top:2rem;font-size:0.7rem;color:rgba(28,24,18,0.2);animation:bob 2s ease infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(6px)}}

/* Particles */
.particle{position:fixed;width:4px;height:4px;background:rgba(30,64,175,0.06);border-radius:50%;z-index:1;pointer-events:none}

/* Instructions */
.instructions{position:fixed;bottom:2rem;left:50%;transform:translateX(-50%);z-index:100;background:rgba(255,255,255,0.9);backdrop-filter:blur(12px);border:1px solid rgba(28,24,18,0.06);padding:0.6rem 1.5rem;font-size:0.72rem;color:rgba(28,24,18,0.4);display:flex;gap:1.5rem;pointer-events:none}
.instructions span{display:flex;align-items:center;gap:0.3rem}

@media(max-width:768px){
  .card{width:240px;padding:1rem 1.2rem}
  .nav{padding:0 1rem}
  .instructions{display:none}
}
</style>
</head>
<body>

<nav class="nav">
  <a class="logo" href="#">CryptoSynth</a>
  <div class="nav-links">
    <a href="#" class="active">Catatan</a>
    <a href="#">Airdrop</a>
    <a href="#">Tools</a>
    <a href="#">Tentang</a>
  </div>
</nav>

<canvas id="bgCanvas"></canvas>

<div class="hero-overlay" id="heroOverlay">
  <h1>Catatan Crypto<br>Personal</h1>
  <p>Node logs, airdrop farming, trading, dan opini crypto dari sudut pandang pribadi.</p>
  <div class="hint">↕ Drag kartu untuk bermain</div>
</div>

<div class="instructions">
  <span>🖱️ Drag kartu</span>
  <span>👆 Click untuk baca</span>
  <span>↔ Lepas untuk lempar</span>
</div>

<script>
// Physics floating cards
const articles = [
  {tag:'AIRDROP · Q2-2026',title:'7 Airdrop yang Layak Difarming Q2 2026',exc:'Polymarket, Beacon, SosoValue.',date:'29 Mei'},
  {tag:'SOFI · STABLECOIN',title:'SoFi Luncurkan Stablecoin (SoFiUSD)',exc:'Bank Pertama di AS Masuk On-Chain.',date:'29 Mei'},
  {tag:'VARIATIONAL · AIRDROP',title:'Variational Deep-Dive: Tim Ex-Jane Street',exc:'Tim, model bisnis, strategi farming.',date:'28 Mei'},
  {tag:'OPTIMAI · TUTORIAL',title:'Install OptimAI Core Node di VPS',exc:'CLI Setup + Systemd Service.',date:'27 Mei'},
  {tag:'SYMB · PROPRXYZ',title:'SYMB TGE Juni, ProprXYZ di Hyperliquid',exc:'3 Airdrop yang Wajib Dicek.',date:'27 Mei'},
  {tag:'OPTIMAI · AIRDROP',title:'OptimAI: Farming DePIN + AI',exc:'2 Juta Node Aktif.',date:'26 Mei'},
  {tag:'CATENA · AIRDROP',title:'Catena Labs: $48M dari a16z',exc:'Spekulatif atau Peluang Nyata?',date:'26 Mei'},
];

// Background canvas (subtle particles)
const bgCanvas = document.getElementById('bgCanvas');
const bgCtx = bgCanvas.getContext('2d');
let bgW, bgH;
function bgResize(){bgW=bgCanvas.width=window.innerWidth;bgH=bgCanvas.height=window.innerHeight;}
bgResize();window.addEventListener('resize',bgResize);

const particles = Array.from({length:60},()=>({
  x:Math.random()*window.innerWidth,
  y:Math.random()*window.innerHeight,
  vx:(Math.random()-0.5)*0.3,
  vy:(Math.random()-0.5)*0.3,
  r:Math.random()*2+1,
  alpha:Math.random()*0.08+0.02
}));

function drawBg(){
  bgCtx.clearRect(0,0,bgW,bgH);
  particles.forEach(p=>{
    p.x+=p.vx;p.y+=p.vy;
    if(p.x<0)p.x=bgW;if(p.x>bgW)p.x=0;
    if(p.y<0)p.y=bgH;if(p.y>bgH)p.y=0;
    bgCtx.beginPath();bgCtx.arc(p.x,p.y,p.r,0,Math.PI*2);
    bgCtx.fillStyle=`rgba(30,64,175,${p.alpha})`;bgCtx.fill();
  });
  // Lines between close particles
  for(let i=0;i<particles.length;i++){
    for(let j=i+1;j<particles.length;j++){
      const dx=particles[i].x-particles[j].x,dy=particles[i].y-particles[j].y;
      const dist=Math.sqrt(dx*dx+dy*dy);
      if(dist<150){
        bgCtx.beginPath();bgCtx.moveTo(particles[i].x,particles[i].y);bgCtx.lineTo(particles[j].x,particles[j].y);
        bgCtx.strokeStyle=`rgba(30,64,175,${0.03*(1-dist/150)})`;bgCtx.lineWidth=0.5;bgCtx.stroke();
      }
    }
  }
  requestAnimationFrame(drawBg);
}
drawBg();

// Card physics
const cards = [];
let dragCard = null;
let dragOffsetX, dragOffsetY;
let mouseX = 0, mouseY = 0;
let heroVisible = true;

function createCards(){
  articles.forEach((a,i)=>{
    const el = document.createElement('div');
    el.className = 'card';
    el.innerHTML = `<div class="card-tag">#${a.tag}</div><div class="card-title">${a.title}</div><div class="card-exc">${a.exc}</div><div class="card-footer"><span class="card-date">${a.date}</span><span class="card-arrow">→</span></div>`;
    document.body.appendChild(el);

    // Position in a scattered layout
    const cols = Math.min(3, Math.floor(window.innerWidth / 320));
    const col = i % cols;
    const row = Math.floor(i / cols);
    const baseX = (window.innerWidth - cols * 300) / 2 + col * 300;
    const baseY = 120 + row * 180;

    cards.push({
      el, x: baseX + (Math.random()-0.5)*40, y: baseY + (Math.random()-0.5)*30,
      vx: 0, vy: 0,
      targetX: baseX, targetY: baseY,
      width: 280, height: el.offsetHeight || 160,
      dragging: false, friction: 0.92, spring: 0.01
    });
  });
}

function physics(){
  cards.forEach(c=>{
    if(c.dragging)return;
    // Spring back to target
    const dx = c.targetX - c.x;
    const dy = c.targetY - c.y;
    c.vx += dx * c.spring;
    c.vy += dy * c.spring;
    // Gentle drift
    c.vx += (Math.random()-0.5)*0.05;
    c.vy += (Math.random()-0.5)*0.05;
    // Friction
    c.vx *= c.friction;
    c.vy *= c.friction;
    c.x += c.vx;
    c.y += c.vy;
    // Bounds
    c.x = Math.max(0, Math.min(window.innerWidth - c.width, c.x));
    c.y = Math.max(60, Math.min(window.innerHeight - c.height - 40, c.y));
    c.el.style.left = c.x + 'px';
    c.el.style.top = c.y + 'px';
  });
  requestAnimationFrame(physics);
}

// Mouse/touch interaction
document.addEventListener('mousedown', e => {
  const cardEl = e.target.closest('.card');
  if(!cardEl)return;
  const card = cards.find(c=>c.el===cardEl);
  if(!card)return;
  dragCard = card;
  card.dragging = true;
  card.el.classList.add('dragging');
  dragOffsetX = e.clientX - card.x;
  dragOffsetY = e.clientY - card.y;
  if(heroVisible){heroVisible=false;document.getElementById('heroOverlay').classList.add('hidden');}
});

document.addEventListener('mousemove', e => {
  mouseX = e.clientX; mouseY = e.clientY;
  if(!dragCard)return;
  dragCard.x = e.clientX - dragOffsetX;
  dragCard.y = e.clientY - dragOffsetY;
  dragCard.el.style.left = dragCard.x + 'px';
  dragCard.el.style.top = dragCard.y + 'px';
});

document.addEventListener('mouseup', e => {
  if(!dragCard)return;
  dragCard.dragging = false;
  dragCard.el.classList.remove('dragging');
  // Give velocity based on last movement
  dragCard.vx = (e.movementX || 0) * 0.3;
  dragCard.vy = (e.movementY || 0) * 0.3;
  dragCard.targetX = dragCard.x;
  dragCard.targetY = dragCard.y;
  dragCard = null;
});

// Touch
document.addEventListener('touchstart', e => {
  const cardEl = e.target.closest('.card');
  if(!cardEl)return;
  const card = cards.find(c=>c.el===cardEl);
  if(!card)return;
  dragCard = card; card.dragging = true; card.el.classList.add('dragging');
  const t = e.touches[0];
  dragOffsetX = t.clientX - card.x; dragOffsetY = t.clientY - card.y;
  if(heroVisible){heroVisible=false;document.getElementById('heroOverlay').classList.add('hidden');}
},{passive:true});

document.addEventListener('touchmove', e => {
  if(!dragCard)return;
  const t = e.touches[0];
  dragCard.x = t.clientX - dragOffsetX;
  dragCard.y = t.clientY - dragOffsetY;
  dragCard.el.style.left = dragCard.x+'px'; dragCard.el.style.top = dragCard.y+'px';
},{passive:true});

document.addEventListener('touchend', () => {
  if(!dragCard)return;
  dragCard.dragging = false; dragCard.el.classList.remove('dragging');
  dragCard.targetX = dragCard.x; dragCard.targetY = dragCard.y;
  dragCard = null;
});

// Recalc targets on resize
window.addEventListener('resize', ()=>{
  const cols = Math.min(3, Math.floor(window.innerWidth / 320));
  cards.forEach((c,i)=>{
    const col = i%cols, row = Math.floor(i/cols);
    c.targetX = (window.innerWidth - cols*300)/2 + col*300;
    c.targetY = 120 + row*180;
    c.width = c.el.offsetWidth;
    c.height = c.el.offsetHeight;
  });
});

createCards();
physics();
</script>
</body>
</html>
