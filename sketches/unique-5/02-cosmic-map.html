<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CryptoSynth — Cosmic Knowledge Map</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@300;400;700;900&family=DM+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',sans-serif;background:#050510;color:#e0e0e8;overflow:hidden;height:100vh;width:100vw}
::selection{background:rgba(96,165,250,0.3)}

canvas{position:fixed;inset:0;z-index:0}

.overlay{position:fixed;inset:0;z-index:1;pointer-events:none}

/* Nav */
.nav{position:fixed;top:0;left:0;right:0;height:52px;padding:0 2rem;display:flex;justify-content:space-between;align-items:center;z-index:100;background:rgba(5,5,16,0.6);backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,0.04)}
.logo{font-family:'Fraunces',serif;font-size:0.95rem;font-weight:700;color:#fff;text-decoration:none}
.logo span{color:#60a5fa}
.nav-right{display:flex;align-items:center;gap:1.5rem}
.nav-links{display:flex;gap:1.5rem;pointer-events:all}
.nav-links a{color:rgba(255,255,255,0.3);text-decoration:none;font-size:0.72rem;font-weight:500;letter-spacing:0.05em;transition:color 0.2s}
.nav-links a:hover{color:#fff}
.nav-links a.active{color:#60a5fa}
.zoom-info{font-family:'JetBrains Mono',monospace;font-size:0.6rem;color:rgba(255,255,255,0.15);pointer-events:none}

/* Legend */
.legend{position:fixed;bottom:2rem;left:2rem;z-index:100;background:rgba(5,5,16,0.7);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.06);padding:1.25rem;pointer-events:all;min-width:180px}
.legend h4{font-family:'JetBrains Mono',monospace;font-size:0.6rem;text-transform:uppercase;letter-spacing:0.15em;color:rgba(255,255,255,0.3);margin-bottom:0.75rem}
.legend-item{display:flex;align-items:center;gap:0.6rem;margin-bottom:0.5rem;font-size:0.72rem;color:rgba(255,255,255,0.5)}
.legend-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.legend-line{width:20px;height:1px;flex-shrink:0}

/* Info panel */
.info-panel{position:fixed;bottom:2rem;right:2rem;z-index:100;background:rgba(5,5,16,0.85);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,0.08);padding:1.5rem;max-width:360px;transform:translateY(20px);opacity:0;transition:all 0.3s cubic-bezier(0.16,1,0.3,1);pointer-events:none}
.info-panel.active{transform:translateY(0);opacity:1;pointer-events:all}
.info-tag{font-size:0.55rem;text-transform:uppercase;letter-spacing:0.15em;color:#f59e0b;margin-bottom:0.5rem;font-weight:600}
.info-title{font-family:'Fraunces',serif;font-size:1.15rem;font-weight:700;color:#fff;line-height:1.3;margin-bottom:0.5rem}
.info-exc{font-size:0.8rem;color:rgba(255,255,255,0.4);line-height:1.55;margin-bottom:0.75rem}
.info-meta{font-size:0.65rem;color:rgba(255,255,255,0.2);display:flex;justify-content:space-between;align-items:center}
.info-read{font-size:0.72rem;color:#60a5fa;text-decoration:none;font-weight:500;pointer-events:all;cursor:pointer;transition:opacity 0.2s}.info-read:hover{opacity:0.7}
.info-close{position:absolute;top:0.75rem;right:0.75rem;background:none;border:none;color:rgba(255,255,255,0.2);cursor:pointer;font-size:1rem;pointer-events:all}

/* Center label */
.center-label{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;z-index:50;pointer-events:none;transition:opacity 0.5s}
.center-label.hidden{opacity:0}
.center-label h1{font-family:'Fraunces',serif;font-size:clamp(2rem,4vw,3rem);font-weight:300;color:rgba(255,255,255,0.08);letter-spacing:-0.02em}
.center-label p{font-size:0.75rem;color:rgba(255,255,255,0.08);margin-top:0.5rem}

/* Controls */
.controls{position:fixed;bottom:2rem;left:50%;transform:translateX(-50%);z-index:100;display:flex;gap:0.5rem;pointer-events:all}
.ctrl-btn{background:rgba(5,5,16,0.7);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,0.08);color:rgba(255,255,255,0.4);padding:0.4rem 0.8rem;font-family:'JetBrains Mono',monospace;font-size:0.65rem;cursor:pointer;transition:all 0.2s}
.ctrl-btn:hover{border-color:rgba(255,255,255,0.2);color:rgba(255,255,255,0.7)}
.ctrl-btn.active{background:rgba(96,165,250,0.15);border-color:rgba(96,165,250,0.3);color:#60a5fa}

@media(max-width:768px){
  .legend{display:none}
  .info-panel{left:1rem;right:1rem;bottom:1rem;max-width:none}
  .controls{flex-wrap:wrap;justify-content:center}
  .nav-links{display:none}
}
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<nav class="nav">
  <a class="logo" href="#">Crypto<span>Synth</span></a>
  <div class="nav-right">
    <div class="nav-links">
      <a href="#" class="active">Map</a>
      <a href="#">Catatan</a>
      <a href="#">Airdrop</a>
      <a href="#">Tentang</a>
    </div>
    <span class="zoom-info" id="zoomInfo">1.0x</span>
  </div>
</nav>

<div class="center-label" id="centerLabel">
  <h1>Catatan Crypto Personal</h1>
  <p>Klik node untuk menjelajahi</p>
</div>

<div class="legend">
  <h4>Kategori</h4>
  <div class="legend-item"><div class="legend-dot" style="background:#f59e0b"></div> Airdrop</div>
  <div class="legend-item"><div class="legend-dot" style="background:#10b981"></div> Tutorial</div>
  <div class="legend-item"><div class="legend-dot" style="background:#8b5cf6"></div> Stablecoin</div>
  <div class="legend-item"><div class="legend-dot" style="background:#ec4899"></div> DeFi</div>
  <div class="legend-item"><div class="legend-line" style="background:rgba(255,255,255,0.1)"></div> Related articles</div>
</div>

<div class="info-panel" id="infoPanel">
  <button class="info-close" onclick="closePanel()">×</button>
  <div class="info-tag" id="infoTag"></div>
  <div class="info-title" id="infoTitle"></div>
  <div class="info-exc" id="infoExc"></div>
  <div class="info-meta">
    <span id="infoDate"></span>
    <a class="info-read" href="#">Baca →</a>
  </div>
</div>

<div class="controls">
  <button class="ctrl-btn" onclick="resetView()">Reset</button>
  <button class="ctrl-btn" onclick="zoomIn()">+</button>
  <button class="ctrl-btn" onclick="zoomOut()">-</button>
  <button class="ctrl-btn" onclick="toggleLines()" id="linesBtn">Lines</button>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let W, H;

function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;}
resize();window.addEventListener('resize',resize);

// Nodes (articles)
const nodes = [
  {id:0,label:'7 Airdrop Q2 2026',tag:'AIRDROP',cat:'Q2-2026',exc:'Polymarket, Beacon, SosoValue, dan lainnya.',date:'29 Mei',color:'#f59e0b',x:0.35,y:0.3,r:18},
  {id:1,label:'SoFiUSD Stablecoin',tag:'SOFI',cat:'STABLECOIN',exc:'Bank Nasional Pertama di AS yang Berani Masuk On-Chain.',date:'29 Mei',color:'#8b5cf6',x:0.65,y:0.25,r:14},
  {id:2,label:'Variational Deep-Dive',tag:'VARIATIONAL',cat:'AIRDROP',exc:'Breakdown lengkap: tim, model bisnis, strategi farming.',date:'28 Mei',color:'#f59e0b',x:0.25,y:0.55,r:16},
  {id:3,label:'OptimAI Node VPS',tag:'OPTIMAI',cat:'TUTORIAL',exc:'CLI Setup + Systemd Service.',date:'27 Mei',color:'#10b981',x:0.55,y:0.5,r:14},
  {id:4,label:'SYMB + ProprXYZ',tag:'SYMB',cat:'PROPRXYZ',exc:'3 Airdrop yang Wajib Dicek.',date:'27 Mei',color:'#f59e0b',x:0.7,y:0.6,r:13},
  {id:5,label:'OptimAI DePIN + AI',tag:'OPTIMAI',cat:'AIRDROP',exc:'2 Juta Node Aktif. Token OPI belum TGE.',date:'26 Mei',color:'#f59e0b',x:0.4,y:0.72,r:15},
  {id:6,label:'Catena Labs $48M',tag:'CATENA',cat:'AIRDROP',exc:'$48M dari a16z. Breakdown on-chain.',date:'26 Mei',color:'#f59e0b',x:0.6,y:0.78,r:13},
];

// Connections (related articles)
const edges = [[0,2],[0,4],[0,5],[2,5],[3,5],[4,6],[5,6],[0,6],[1,0]];

// Background stars
const stars = Array.from({length:200},()=>({x:Math.random(),y:Math.random(),size:Math.random()*1.5+0.3,alpha:Math.random()*0.5+0.1,speed:Math.random()*0.0002+0.0001}));

let viewX=0,viewY=0,zoom=1,targetZoom=1;
let showLines=true;
let selectedNode=null;
let hoverNode=null;
let isDragging=false,dragStartX,dragStartY,viewStartX,viewStartY;
let t=0;

function worldToScreen(wx,wy){
  return{
    x:(wx-viewX)*zoom*W+W/2,
    y:(wy-viewY)*zoom*H+H/2
  };
}
function screenToWorld(sx,sy){
  return{
    x:(sx-W/2)/(zoom*W)+viewX,
    y:(sy-H/2)/(zoom*H)+viewY
  };
}

function draw(){
  t+=0.01;
  ctx.clearRect(0,0,W,H);

  // Background gradient
  const grad=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,W*0.7);
  grad.addColorStop(0,'#0a0a20');grad.addColorStop(1,'#050510');
  ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);

  // Stars
  stars.forEach(s=>{
    const alpha=s.alpha+Math.sin(t*2+s.x*10)*0.15;
    ctx.beginPath();
    ctx.arc(s.x*W,s.y*H,s.size,0,Math.PI*2);
    ctx.fillStyle=`rgba(255,255,255,${Math.max(0,alpha)})`;
    ctx.fill();
  });

  // Grid dots (subtle)
  ctx.fillStyle='rgba(255,255,255,0.015)';
  for(let gx=0;gx<1;gx+=0.05){
    for(let gy=0;gy<1;gy+=0.05){
      const p=worldToScreen(gx,gy);
      if(p.x>-10&&p.x<W+10&&p.y>-10&&p.y<H+10){
        ctx.beginPath();ctx.arc(p.x,p.y,1,0,Math.PI*2);ctx.fill();
      }
    }
  }

  // Edges
  if(showLines){
    edges.forEach(([a,b])=>{
      const na=nodes[a],nb=nodes[b];
      const pa=worldToScreen(na.x,na.y),pb=worldToScreen(nb.x,nb.y);
      const dist=Math.sqrt((pa.x-pb.x)**2+(pa.y-pb.y)**2);
      const alpha=Math.max(0,0.08-dist/3000);
      ctx.beginPath();ctx.moveTo(pa.x,pa.y);ctx.lineTo(pb.x,pb.y);
      ctx.strokeStyle=`rgba(96,165,250,${alpha})`;ctx.lineWidth=0.5;ctx.stroke();
    });
  }

  // Nodes
  nodes.forEach(n=>{
    const p=worldToScreen(n.x,n.y);
    if(p.x<-50||p.x>W+50||p.y<-50||p.y>H+50)return;
    const r=n.r*zoom;
    const pulse=Math.sin(t*2+n.id)*2;

    // Glow
    const glow=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,r*3);
    glow.addColorStop(0,n.color+'18');glow.addColorStop(1,'transparent');
    ctx.fillStyle=glow;ctx.fillRect(p.x-r*3,p.y-r*3,r*6,r*6);

    // Node circle
    ctx.beginPath();ctx.arc(p.x,p.y,r+pulse,0,Math.PI*2);
    const isSelected=selectedNode===n.id;
    const isHover=hoverNode===n.id;
    ctx.fillStyle=isSelected?n.color:isHover?n.color+'aa':n.color+'66';
    ctx.fill();

    // Ring
    if(isSelected||isHover){
      ctx.beginPath();ctx.arc(p.x,p.y,r+pulse+4,0,Math.PI*2);
      ctx.strokeStyle=n.color+'44';ctx.lineWidth=1;ctx.stroke();
    }

    // Label
    if(zoom>0.6||isSelected||isHover){
      ctx.font=`${isSelected?'600':'400'} ${Math.max(10,12*zoom)}px 'DM Sans',sans-serif`;
      ctx.fillStyle=isSelected?'#fff':`rgba(255,255,255,${isHover?0.8:0.5})`;
      ctx.textAlign='center';
      ctx.fillText(n.label,p.x,p.y+r+18*zoom);
    }
  });

  // Smooth zoom
  zoom+=(targetZoom-zoom)*0.1;
  document.getElementById('zoomInfo').textContent=zoom.toFixed(1)+'x';

  requestAnimationFrame(draw);
}

// Interaction
canvas.addEventListener('mousemove',e=>{
  if(isDragging){
    viewX=viewStartX-(e.clientX-dragStartX)/(zoom*W);
    viewY=viewStartY-(e.clientY-dragStartY)/(zoom*H);
    return;
  }
  const w=screenToWorld(e.clientX,e.clientY);
  hoverNode=null;
  nodes.forEach(n=>{
    const dist=Math.sqrt((n.x-w.x)**2+(n.y-w.y)**2);
    if(dist<0.03/zoom){hoverNode=n.id;canvas.style.cursor='pointer';}
  });
  if(hoverNode===null)canvas.style.cursor='grab';
});

canvas.addEventListener('mousedown',e=>{
  isDragging=true;dragStartX=e.clientX;dragStartY=e.clientY;viewStartX=viewX;viewStartY=viewY;
  canvas.style.cursor='grabbing';
});

canvas.addEventListener('mouseup',e=>{
  if(Math.abs(e.clientX-dragStartX)<5&&Math.abs(e.clientY-dragStartY)<5){
    // Click
    if(hoverNode!==null){
      selectedNode=hoverNode;
      showInfo(nodes[hoverNode]);
      document.getElementById('centerLabel').classList.add('hidden');
    }else{
      selectedNode=null;
      closePanel();
    }
  }
  isDragging=false;canvas.style.cursor='grab';
});

canvas.addEventListener('wheel',e=>{
  e.preventDefault();
  targetZoom*=e.deltaY>0?0.9:1.1;
  targetZoom=Math.max(0.3,Math.min(4,targetZoom));
},{passive:false});

// Touch support
let lastTouchDist=0;
canvas.addEventListener('touchstart',e=>{
  if(e.touches.length===1){
    isDragging=true;dragStartX=e.touches[0].clientX;dragStartY=e.touches[0].clientY;viewStartX=viewX;viewStartY=viewY;
  }
  if(e.touches.length===2){
    lastTouchDist=Math.hypot(e.touches[1].clientX-e.touches[0].clientX,e.touches[1].clientY-e.touches[0].clientY);
  }
},{passive:true});
canvas.addEventListener('touchmove',e=>{
  if(e.touches.length===1&&isDragging){
    viewX=viewStartX-(e.touches[0].clientX-dragStartX)/(zoom*W);
    viewY=viewStartY-(e.touches[0].clientY-dragStartY)/(zoom*H);
  }
  if(e.touches.length===2){
    const dist=Math.hypot(e.touches[1].clientX-e.touches[0].clientX,e.touches[1].clientY-e.touches[0].clientY);
    targetZoom*=dist/lastTouchDist;
    targetZoom=Math.max(0.3,Math.min(4,targetZoom));
    lastTouchDist=dist;
  }
},{passive:true});
canvas.addEventListener('touchend',()=>{
  if(!isDragging)return;
  isDragging=false;
});

function showInfo(n){
  document.getElementById('infoTag').textContent='#'+n.tag+' · #'+n.cat;
  document.getElementById('infoTitle').textContent=n.label;
  document.getElementById('infoExc').textContent=n.exc;
  document.getElementById('infoDate').textContent=n.date;
  document.getElementById('infoPanel').classList.add('active');
}
function closePanel(){document.getElementById('infoPanel').classList.remove('active');selectedNode=null;}
function resetView(){viewX=0.45;viewY=0.5;targetZoom=1;}
function zoomIn(){targetZoom=Math.min(4,targetZoom*1.3);}
function zoomOut(){targetZoom=Math.max(0.3,targetZoom/1.3);}
function toggleLines(){showLines=!showLines;document.getElementById('linesBtn').classList.toggle('active',showLines);}

resetView();
document.getElementById('linesBtn').classList.add('active');
draw();
</script>
</body>
</html>
