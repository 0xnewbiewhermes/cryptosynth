<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <linearGradient id="sapphire" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="sapphireLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
  </defs>

  <!-- Icon mark: Interlocking hexagon + diamond shape -->
  <g transform="translate(10, 10)">
    <!-- Outer hexagon (blockchain/crypto) -->
    <polygon points="30,0 56,8 56,32 30,40 4,32 4,8" fill="none" stroke="url(#sapphire)" stroke-width="2.5" opacity="0.3"/>
    
    <!-- Inner diamond (synthesis/gem) -->
    <polygon points="30,5 50,20 30,35 10,20" fill="url(#sapphire)" opacity="0.95"/>
    
    <!-- Sparkle accent -->
    <circle cx="22" cy="14" r="1.5" fill="#FFFFFF" opacity="0.8"/>
    <circle cx="38" cy="14" r="1" fill="#FFFFFF" opacity="0.6"/>
    
    <!-- Subtle inner glow diamond -->
    <polygon points="30,10 44,20 30,30 16,20" fill="url(#sapphireLight)" opacity="0.4"/>
  </g>

  <!-- Text: CryptoSynth -->
  <text x="80" y="42" font-family="'Playfair Display', 'Georgia', serif" font-size="36" font-weight="700" fill="#1C1812" letter-spacing="-0.03">
    Crypto<tspan fill="url(#sapphire)">Synth</tspan>
  </text>
  
  <!-- Tagline -->
  <text x="81" y="60" font-family="'Outfit', 'Inter', system-ui, sans-serif" font-size="11" fill="#1C1812" opacity="0.45" letter-spacing="0.15" font-weight="400">
    RINGKASAN BERITA WEB3 INDONESIA
  </text>
</svg>
